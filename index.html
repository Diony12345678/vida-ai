
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIDA AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;padding:20px;background:#0b1220;color:white;font-family:Arial}
main{max-width:650px;margin:auto}
h1{color:#62e6b1;font-size:36px}
.card{background:#152238;padding:20px;border-radius:14px;margin:16px 0}
input,textarea{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;background:#0b1423;color:white;border:1px solid #34445c;border-radius:8px}
textarea{min-height:100px}
button{width:100%;padding:14px;margin-top:10px;background:#62e6b1;border:0;border-radius:8px;font-weight:bold}
.secondary{background:#34445c;color:white}
.muted{color:#a7b5c8}
#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#62e6b1}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#09111d;padding:12px}
</style>
</head>
<body>
<main>
<h1>VIDA AI</h1>
<p class="muted">Painel central de inteligência e operações</p>

<div class="card">
<h2>Segurança financeira</h2>
<p>Orçamento de testes: R$ 0,00</p>
<p>Reinvestimento planejado: 60%</p>
<p>Operações financeiras reais: DESATIVADAS</p>
</div>

<div class="card" id="login">
<h2>Acesso à VIDA AI</h2>
<input id="email" type="email" placeholder="Seu e-mail">
<input id="password" type="password" placeholder="Sua senha">
<button onclick="entrar()">Entrar</button>
</div>

<div class="card" id="painel" hidden>
<h2>Centro de comando</h2>
<p id="usuario" class="muted"></p>
<textarea id="objective" maxlength="1000" placeholder="Digite um objetivo para a VIDA AI"></textarea>
<button onclick="enviar()">Enviar objetivo ao VIDA CORE</button>
<button class="secondary" onclick="sair()">Sair</button>
</div>

<div class="card">
<p id="status">Aguardando conexão...</p>
<pre id="resultado" hidden></pre>
</div>
</main>

<script>
const SUPABASE_URL = "https://bdiiyhcjataabseadyir.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_stY0jbfuEOKs2H7V20HXNA_PLVIXZcH";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function mensagem(texto){
  document.getElementById("status").textContent = texto;
}

function mostrarPainel(usuario){
  document.getElementById("login").hidden = !!usuario;
  document.getElementById("painel").hidden = !usuario;
  document.getElementById("usuario").textContent =
    usuario ? "Conectado: " + usuario.email : "";
}

async function verificar(){
  const {data,error} = await db.auth.getSession();
  if(error){mensagem(error.message);return;}
  mostrarPainel(data.session?.user || null);
  mensagem(data.session ? "Sessão autenticada." : "Faça login para continuar.");
}

async function entrar(){
  mensagem("Verificando acesso...");
  const {data,error} = await db.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){mensagem("Erro no login: "+error.message);return;}
  mostrarPainel(data.user);
  mensagem("Login realizado.");
}

async function enviar(){
  const objective=document.getElementById("objective").value.trim();
  if(!objective){mensagem("Digite um objetivo.");return;}
  mensagem("Enviando ao VIDA CORE...");
  try{
    const {data,error}=await db.functions.invoke("vida-core",{
      body:{objective}
    });
    if(error) throw error;
    document.getElementById("resultado").textContent=
      JSON.stringify(data,null,2);
    document.getElementById("resultado").hidden=false;
    mensagem("Resposta recebida do VIDA CORE.");
  }catch(error){
    mensagem("Falha na comunicação: "+error.message);
  }
}

async function sair(){
  await db.auth.signOut();
  mostrarPainel(null);
  mensagem("Sessão encerrada.");
}

db.auth.onAuthStateChange((_event,session)=>{
  mostrarPainel(session?.user || null);
});

verificar();
</script>
</body>
</html>
